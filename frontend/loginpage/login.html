<!-- ================= index.html ================= -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LookOut Login</title>

  <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-page">

    <!-- ===================================================== -->
<!-- ================= INTRO SCREEN ====================== -->
<!-- ===================================================== -->

<div id="introScreen">

    <video
    id="introVideo"
    autoplay
    muted
    playsinline
    preload="auto">

        <source
        src="../assets/intro.mp4"
        type="video/mp4">

    </video>

</div>

<!-- AUTO REDIRECT IF ALREADY LOGGED IN -->
<script>
  if (localStorage.getItem("isLoggedIn") === "true") {
    window.location.href = "homepage/home.html";
  }
</script>

<div class="container">

  <!-- ================= PROFILE ================= -->
  <div class="group">
    <div class="float">

      <div id="profile" class="card small">

        <h2>Profile</h2>

        <!-- AVATAR -->
        <div class="avatar-wrapper">

          <input type="file" id="photoUpload" accept="image/*" hidden>

          <div class="avatar"
               onclick="document.getElementById('photoUpload').click()">

            <img id="avatarPreview">

            <div class="avatar-icon">ðŸ‘¤</div>

          </div>

        </div>

        <input id="firstName" placeholder="First Name">
<input id="lastName" placeholder="Last Name">
<input id="phoneNumber" placeholder="Phone Number">
<input id="country" placeholder="Country">
<input id="state" placeholder="State">
<input id="city" placeholder="City">
<input id="dateOfBirth" type="date">

        <button onclick="profileDone()">Save</button>

      </div>

    </div>

    <div class="ring small-ring" id="ring-profile"></div>
  </div>

  <!-- ================= LOGIN ================= -->
  <div class="group">
    <div class="float">

      <div id="login" class="card big">

        <h2>Login</h2>

        <input id="email" placeholder="Enter Email">

        <button onclick="sendOTP()">
          Send OTP
        </button>

        <input id="otp"
               placeholder="Enter OTP"
               style="display:none;">

        <button id="verifyBtn"
                onclick="verifyOTP()"
                style="display:none;">

          Verify OTP

        </button>

        <p id="msg"></p>

      </div>

    </div>

    <div class="ring big-ring active-ring"
         id="ring-login"></div>
  </div>

  <!-- ================= PREFERENCES ================= -->
  <div class="group">
    <div class="float">

      <div id="pref" class="card small">

        <h2>Preferences</h2>

        <!-- THEME -->
        <div class="section">

          <p class="section-title">Theme</p>

          <div class="grid">
            <div class="option active">Light</div>
            <div class="option">Dark</div>
          </div>

        </div>

        <!-- PURPOSE -->
        <div class="section">

          <p class="section-title">Purpose</p>

          <div class="grid">
            <div class="option">Image Generation</div>
            <div class="option">Image Edit</div>
          </div>

        </div>

        <!-- STYLE -->
        <div class="section">

          <p class="section-title">Editing Style</p>

          <div class="grid">
            <div class="option">AI</div>
            <div class="option">Manual</div>
          </div>

        </div>

        <button onclick="prefDone()">Done</button>

      </div>

    </div>

    <div class="ring small-ring"
         id="ring-pref"></div>
  </div>

</div>

<!-- FINAL CARD -->
<div id="finalCard">LookOut</div>

<script src="js/login.js"></script>

</body>
</html>
